---
- name: "Import asserts"
  ansible.builtin.import_tasks: "assert.yml"

- name: "Add gitlab chart repo"
  kubernetes.core.helm_repository:
    name: "{{ gitlab_agent_chart_repo_name }}"
    repo_url: "{{ gitlab_agent_chart_repo_url }}"
  check_mode: false
  changed_when: false

- name: "Ensure agent namespaces are present"
  kubernetes.core.k8s:
    name: "{{ item.namespace }}"
    api_version: "v1"
    kind: "Namespace"
    state: "present"
    kubeconfig: "{{ kubeconfig | default(omit) }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.release_name }}"
  loop: "{{ _gitlab_agent_instances_with_defaults }}"

- name: "Ensure target namespaces are present"
  kubernetes.core.k8s:
    name: "{{ item.target_namespace }}"
    api_version: "v1"
    kind: "Namespace"
    state: "present"
    kubeconfig: "{{ kubeconfig | default(omit) }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.release_name }}"
  loop: "{{ _gitlab_agent_instances_with_defaults }}"
  when:
    - "item.use_default_roles"
    - "item.target_namespace is defined"
    - "item.target_namespace != ''"

- name: "Ensure agent roles are present"
  kubernetes.core.k8s:
    state: "present"
    proxy: "{{ proxy_url | default(omit, true) }}"
    proxy_headers: "{{ proxy_headers | default(omit, true) }}"
    resource_definition: "{{ gitlab_agent_roles }}"
    kubeconfig: "{{ kubeconfig }}"
  loop_control:
    label: "{{ _gitlab_agent_instance.namespace }}/{{ _gitlab_agent_instance.release_name }}"
  loop: "{{ _gitlab_agent_instances_with_defaults }}"

- name: "Ensure agent rolebindings are present"
  kubernetes.core.k8s:
    state: "present"
    proxy: "{{ proxy_url | default(omit, true) }}"
    proxy_headers: "{{ proxy_headers | default(omit, true) }}"
    resource_definition: "{{ gitlab_agent_rolebindings }}"
    kubeconfig: "{{ kubeconfig }}"
  loop_control:
    label: "{{ _gitlab_agent_instance.namespace }}/{{ _gitlab_agent_instance.release_name }}"
  loop: "{{ _gitlab_agent_instances_with_defaults }}"

- name: "Install Gitlab Agents"
  kubernetes.core.helm:
    name: "{{ item.release_name }}"
    release_namespace: "{{ item.namespace }}"
    create_namespace: true
    chart_ref: "{{ gitlab_agent_chart_repo_name }}/{{ gitlab_agent_chart_name }}"
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    chart_version: "{{ gitlab_agent_chart_version }}"
    kubeconfig: "{{ kubeconfig | default(omit) }}"
    state: "{{ item.state | default('present') }}"
    values: "{{ lookup('template', 'values.yml.j2') | from_yaml }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.release_name }}"
  loop: "{{ _gitlab_agent_instances_with_defaults }}"
